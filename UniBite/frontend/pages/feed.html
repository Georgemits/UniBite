<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Αγγελίες – UniBite</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="../index.html"><span class="brand-mark">U</span> UniBite</a>
    <button class="nav-toggle" aria-label="Μενού" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    <div class="nav-links" id="nav-links"></div>
  </div>
</nav>

<main class="container">

  <div class="section-title">
    <h2>Διαθέσιμες Αγγελίες</h2>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="list" id="tab-list">Λίστα</button>
      <button class="tab" data-tab="map" id="tab-map">Χάρτης</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="field">
      <label for="sort">Ταξινόμηση</label>
      <select id="sort">
        <option value="recent">Πιο πρόσφατες</option>
        <option value="distance">Κοντινότερες</option>
      </select>
    </div>
    <div class="field">
      <label for="maxKm">Απόσταση (km)</label>
      <input id="maxKm" type="number" min="0.1" step="0.1" placeholder="π.χ. 2">
    </div>
    <div class="field">
      <label for="limit">Max αποτελέσματα</label>
      <input id="limit" type="number" min="1" max="100" value="50">
    </div>
    <button class="btn btn-outline" id="locate-btn" title="Χρήση GPS">📍 Η τοποθεσία μου</button>
  </div>

  <div id="loc-note" class="alert alert-info hidden"></div>

  <div id="list-view">
    <div id="feed-grid" class="grid"></div>
    <div id="feed-empty" class="alert alert-info hidden">Δεν υπάρχουν διαθέσιμες αγγελίες αυτή τη στιγμή.</div>
  </div>

  <div id="map-view" class="hidden">
    <div id="map"></div>
  </div>
</main>

<!-- Modal για λεπτομέρειες αγγελίας -->
<div class="modal-backdrop" id="listing-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="lm-title"></h3>
      <button class="modal-close" data-close>×</button>
    </div>
    <div class="modal-body" id="lm-body"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close>Κλείσιμο</button>
      <button class="btn btn-primary" id="lm-request-btn">Ζήτα μια μερίδα</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="../js/common.js"></script>
<script src="../js/feed.js"></script>
</body>
</html>
